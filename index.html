const B=1,W=-1,N=8;               // B=あなた(黒) W=メスガキ(白)
const DIRS=[-9,-8,-7,-1,1,7,8,9];
const WT=[
 100,-20,10,5,5,10,-20,100,
 -20,-50,-2,-2,-2,-2,-50,-20,
 10,-2,1,1,1,1,-2,10,
 5,-2,1,0,0,1,-2,5,
 5,-2,1,0,0,1,-2,5,
 10,-2,1,1,1,1,-2,10,
 -20,-50,-2,-2,-2,-2,-50,-20,
 100,-20,10,5,5,10,-20,100];
const CORNERS=[0,7,56,63];
const XC=new Set([1,8,9,6,15,14,48,49,57,54,55,62]); // X/C square

// ---------- ルール ----------
function flips(b,i,c){
  if(b[i]!==0)return[];
  const x=i%8,y=(i/8)|0,out=[];
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
    if(!dx&&!dy)continue;
    let cx=x+dx,cy=y+dy;const tmp=[];
    while(cx>=0&&cx<8&&cy>=0&&cy<8&&b[cy*8+cx]===-c){tmp.push(cy*8+cx);cx+=dx;cy+=dy}
    if(tmp.length&&cx>=0&&cx<8&&cy>=0&&cy<8&&b[cy*8+cx]===c)out.push(...tmp);
  }
  return out;
}
function moves(b,c){const m=[];for(let i=0;i<64;i++)if(b[i]===0&&flips(b,i,c).length)m.push(i);return m}
function play(b,i,c){const n=b.slice(),f=flips(b,i,c);n[i]=c;for(const k of f)n[k]=c;return n}
function count(b){let x=0,o=0;for(const v of b){if(v===B)x++;else if(v===W)o++}return[x,o]}

// ---------- 探索 ----------
function evalB(b,c){
  let s=0;for(let i=0;i<64;i++)s+=WT[i]*b[i];
  const mb=moves(b,B).length,mw=moves(b,W).length;
  s+=6*(mb-mw);
  const e=b.filter(v=>v===0).length;
  if(e<12){const[x,o]=count(b);s+=(x-o)*(12-e)*1.5}
  return s*c;
}
function nega(b,c,d,a,be){
  const m=moves(b,c);
  if(!m.length){
    const m2=moves(b,-c);
    if(!m2.length){const[x,o]=count(b);return (x-o)*c*1000}
    return -nega(b,-c,d,-be,-a);
  }
  if(d===0)return evalB(b,c);
  m.sort((p,q)=>WT[q]-WT[p]);
  let best=-Infinity;
  for(const i of m){
    const v=-nega(play(b,i,c),-c,d-1,-be,-a);
    if(v>best)best=v;if(v>a)a=v;if(a>=be)break;
  }
  return best;
}
// c視点で各合法手の評価値(大きいほど良い)
function scoreMoves(b,c,depth){
  return moves(b,c).map(i=>({i,s:-nega(play(b,i,c),-c,depth-1,-Infinity,Infinity)}))
    .sort((p,q)=>q.s-p.s);
}

  const skin="#fff0e6",ink="#7a2f5e",cy=66,L=46,R=74;
  const lash=(cx,s)=>`<path d="M${cx-9} ${cy-4} Q${cx} ${cy-16} ${cx+9} ${cy-4}" fill="none" stroke="${ink}" stroke-width="3.2" stroke-linecap="round"/><path d="M${cx+9*s} ${cy-4} q${5*s} -1 ${7*s} -5" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/><path d="M${cx-6} ${cy-12.5} q0 -3 -1 -4 M${cx+1} ${cy-14.5} q0 -3 -1 -4" stroke="${ink}" stroke-width="1.4" stroke-linecap="round"/>`;

let dotMode=true,curFace="smug",certainLoss=false,certainWin=false,announced=false,announcedDoom=false;
const faceUrl=k=>FACE_PIX[k]||"faces/"+k+".png";
const faceImg={};
const FALLBACK={love:"smug"}; // 専用画像が無い表情は別の画像で代用
const HEARTS='<span class="hz"><i style="left:12%;animation-delay:0s">♡</i><i style="left:38%;animation-delay:.5s">♥</i><i style="left:62%;animation-delay:1s">♡</i><i style="left:82%;animation-delay:.3s">♥</i></span>';
function setFace(e){
  curFace=e;
  const box=$("face");
  const show=()=>{
    const src=faceImg[e]===true?e:(FALLBACK[e]&&faceImg[FALLBACK[e]]===true?FALLBACK[e]:null);
    if(src)box.innerHTML='<img src="'+faceUrl(src)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block;image-rendering:'+(dotMode?"pixelated":"auto")+'">'+(e==="love"?HEARTS:"");
    else box.innerHTML=faceSVG(e);
  };
  const load=k=>new Promise(r=>{ if(faceImg[k]!==undefined)return r();
    faceImg[k]=false; const im=new Image(); im.onload=()=>{faceImg[k]=true;r()}; im.onerror=()=>r(); im.src=faceUrl(k); });
  show();
  Promise.all([load(e),FALLBACK[e]?load(FALLBACK[e]):0]).then(show);
}
function say(k,txt){ $("say").textContent=txt??pick(L[k]); setFace(faceFor[k]||"smug"); }

// ---------- 状態 ----------
let idleT=null,idleN=0,hist=[],cocky=0,maxCocky=0,hinted=false,board,turn,level=2,busy=false,lastMove=-1,hints=[],over=false;
function init(){
  board=Array(64).fill(0);
  board[27]=W;board[36]=W;board[28]=B;board[35]=B;
  turn=B;busy=false;lastMove=-1;over=false;hist=[];idleN=0;hinted=false;cocky=0;maxCocky=0;certainLoss=false;certainWin=false;announced=false;announcedDoom=false;updGauge();
  $("over").style.display="none";
  say("start");render();refreshHint();
}
function render(){
  const el=$("board");el.innerHTML="";
  const ok=(turn===B&&!busy&&!over)?new Set(moves(board,B)):new Set();
  for(let i=0;i<64;i++){
    const c=document.createElement("div");
    c.className="cell"+(ok.has(i)?" ok":"")+(i===lastMove?" last":"");
    if(board[i]){const d=document.createElement("div");d.className="disc "+(board[i]===B?"b":"w");c.appendChild(d)}
    const h=hints.findIndex(x=>x.i===i);
    if(h>=0&&ok.has(i)){const d=document.createElement("div");d.className="hint r"+(h+1);d.textContent=h===0?"★":h+1;c.appendChild(d)}
    c.onclick=()=>onPlayer(i);
    el.appendChild(c);
  }
  const[x,o]=count(board);$("sb").textContent=x;$("sw").textContent=o;
  $("undo").disabled=!(hist.length&&(!busy||over));
  $("turn").textContent=over?"":(turn===B?"あなたの番":"メスガキの番…");
}
// 放置の煽り: あなたの番で20秒動かないと煽り、その後は15秒おきに煽る(長いほど強め)
function armIdle(){
  clearTimeout(idleT);
  if(turn!==B||over)return;
  idleT=setTimeout(idleTaunt,idleN?15000:20000);
}
function idleTaunt(){
  if(turn!==B||busy||over||$("over").style.display==="grid")return;
  idleN++;
  if(idleN<=1)say("bored",pick(L.idle1));
  else if(idleN<=3)say("laugh",pick(L.idle2));
  else say("tease",pick(L.idle3));
  armIdle();
}
function refreshHint(){
  armIdle();
  const box=$("sensei");
  hints=[];
  if(!$("wk").checked||turn!==B||over){box.style.display="none";render();return}
  hinted=true;
  const sc=scoreMoves(board,B,5);
  hints=sc.slice(0,3);
  if(sc.length){
    const best=sc[0],after=play(board,best.i,B);
    let why=[];
    if(CORNERS.includes(best.i))why.push("角が取れる！");
    const oppN=moves(after,W).length;
    why.push(`相手の置ける場所が${oppN}箇所に減る`);
    if(XC.has(best.i)&&!CORNERS.some(c=>board[c]===0&&false))why.push("（危険マスだけど他よりマシ）");
    const flipN=flips(board,best.i,B).length;
    why.push(`${flipN}枚ひっくり返せる`);
    box.style.display="block";
    box.innerHTML=`🔮 <b>ワカラセマン</b>：最善手は <b>${name(best.i)}</b>（★）。${why.join("・")}。`+
      (sc.length>1?`<br>次点：${sc.slice(1,3).map(h=>name(h.i)).join(" / ")}`:"");
  }
  render();
}

// ---------- 進行 ----------
function onPlayer(i){
  if(busy||over||turn!==B)return;
  const ms=moves(board,B);if(!ms.includes(i))return;
  busy=true;clearTimeout(idleT);idleN=0;
  hist.push({board:board.slice(),lastMove,cocky,maxCocky,certainLoss,certainWin,announced,announcedDoom});
  // 悪手判定（ガチ探索）
  const sc=scoreMoves(board,B,4);
  const best=sc[0].s,mine=sc.find(x=>x.i===i).s,loss=best-mine;
  const hadCornerAccess=moves(board,W).some(m=>CORNERS.includes(m));
  board=play(board,i,B);lastMove=i;hints=[];
  const givesCorner=!hadCornerAccess&&moves(board,W).some(m=>CORNERS.includes(m));
  render();
  // 反応
  let kind;
  if(CORNERS.includes(i))kind="corner";
  else if(givesCorner&&XC.has(i))kind="gift";
  else if(sc.length>1&&(sc[0].s-sc[sc.length-1].s)<50)kind="even";   // どれを選んでも大差ない(序盤など)
  else if(sc.length>1&&loss<=8&&(best-sc[Math.floor(sc.length/2)].s)>=25)kind="great";  // 他の手より明らかに良い手だけ
  else if(sc.length>1&&loss<=8)kind="ok";
  else if(loss<=40||sc.length===1)kind="ok";
  else if(loss<=110)kind="bad";
  else kind="awful";
  // AIの先読み: 終盤は完全読みで「負け確定」を判定。それ以前は評価値で「劣勢」を判定
  const empt=board.filter(v=>v===0).length;
  const rd=READ[level];
  const ex=empt<=rd.exact?exact(board,W,-65,65):null;   // AI視点の最終石差(読める強さ・残りのときだけ)
  certainLoss=ex!==null&&ex>0;        // あなたの負け確定
  certainWin=ex!==null&&ex<0;         // あなたの勝ち確定(AIの負け)
  react(kind,{choices:sc.length,proven:certainLoss,losing:best<=rd.lose,doomed:certainWin,threatened:best>=rd.win});
  turn=W;
  setTimeout(aiTurn,readWait());
}
// 終盤の完全読み(残り少ないときだけ使う): 手番側から見た最終石差
// AIの強さごとの「読み」: 完全読みする残りマス数 / 劣勢・優勢とみなす評価値
// ざこはほとんど読めない(判定しない)。ふつうは浅く、ガチは深く読む。
const READ={1:{exact:0,lose:-Infinity,win:Infinity},2:{exact:6,lose:-350,win:350},3:{exact:10,lose:-250,win:250}};
function exact(b,c,a,be){
  const m=moves(b,c);
  if(!m.length){
    if(!moves(b,-c).length){const[x,o]=count(b);return(x-o)*c}
    return -exact(b,-c,-be,-a);
  }
  let best=-99;
  for(const i of m){const v=-exact(play(b,i,c),-c,-be,-a);if(v>best)best=v;if(v>a)a=v;if(a>=be)break}
  return best;
}
function undo(){
  if(!hist.length||(busy&&!over))return;
  const h=hist.pop();
  board=h.board;lastMove=h.lastMove;maxCocky=h.maxCocky;certainLoss=h.certainLoss;certainWin=h.certainWin;
  announced=h.announced;announcedDoom=h.announcedDoom;cocky=Math.min(h.cocky+1,8);  // 戻すと、ちょっと調子に乗られる
  turn=B;busy=false;over=false;$("over").style.display="none";
  updGauge();refreshHint();say("undo");
}
function chooseAI(){
  const ms=moves(board,W);
  if(level===1)return pick(ms);
  const sc=scoreMoves(board,W,level===2?2:5);
  const top=sc.filter(x=>x.s>=sc[0].s-(level===2?6:0));
  return pick(top).i;
}
// セリフを読む時間: 最低1.8秒、長い文は最大3.5秒まで待ってからAIが打つ
function readWait(){return Math.min(3500,Math.max(1800,1000+$("say").textContent.length*40))}
function updGauge(){
  const t=cocky>=6?2:cocky>=3?1:0;
  $("gfill").style.width=Math.min(cocky,8)/8*100+"%";
  $("gtxt").textContent=certainWin?"大ピンチ😰":certainLoss?"勝ち確定💢":["平常運転","調子乗り中♡","調子MAX💢"][t];
  $("face").className="face"+(t?" t"+t:"");
}
function react(kind,ctx){
  ctx=ctx||{};
  // AIが「自分が負ける」と読んだとき: 調子に乗れない(上限を下げて、焦る)
  if(ctx.doomed||ctx.threatened){
    cocky=Math.min(cocky,ctx.doomed?0:2);maxCocky=Math.max(maxCocky,0);
    if(ctx.doomed&&(!announcedDoom||Math.random()<.5)){announcedDoom=true;say("doomed",pick(L.doomed));updGauge();return}
    if(ctx.threatened&&!ctx.doomed&&Math.random()<.45){say("nervous",pick(L.nervous));updGauge();return}
    if(ctx.doomed){say("doomed",pick(L.doomed));updGauge();return}
    // 優勢でも動揺しきらない通常反応へ(ゲージは上限2)
    const prev=cocky;
    if(kind==="great"||kind==="corner")say(kind);
    else if(kind==="forced"||(ctx.choices||9)<=2)say("forced",pick(L.forced));
    else if(kind==="ok")say("ok");
    else say(kind==="awful"||kind==="bad"||kind==="gift"?kind:"ok");
    cocky=Math.min(prev,2);updGauge();return;
  }
  const floor=ctx.proven?6:(ctx.losing?3:0);   // 勝ちが見えているあいだは、調子乗り度の下限を保つ
  // 置ける場所が少なすぎる(選択肢2つ以下)ときの手は、最善手でも実力ではない
  if((ctx.choices||9)<=2&&(kind==="great"||kind==="corner"||kind==="ok"))kind="forced";
  const was=cocky;
  if(kind==="great"||kind==="corner"){
    if(floor>=3){
      // 負けが見えているプレイヤーの良い手は気にしない
      cocky=Math.max(floor,cocky-1);maxCocky=Math.max(maxCocky,cocky);
      if(floor>=6)say("c2",pick(L.certain));else say("c1",pick(L.leading));
      updGauge();return;
    }
    // 一気にゼロにはしない: 良い手で-3、角取りで-4(調子に乗っていたなら最低1は残る)
    cocky=Math.max(0,cocky-(kind==="corner"?4:3));
    if(was>=3)cocky=Math.max(cocky,1);
    if(was>=3){say("shaken");updGauge();return}
    say(kind);
  }else if(kind==="bad"||kind==="gift"){
    cocky+=1;
  }else if(kind==="awful"){cocky+=2}
  cocky=Math.max(cocky,floor);
  maxCocky=Math.max(maxCocky,cocky);
  // 負け確定の煽り(初回は必ず、以降は半分の確率)
  if(ctx.proven&&(!announced||Math.random()<.5)){announced=true;say("c2",pick(L.certain));updGauge();return}
  if(ctx.losing&&Math.random()<.5&&kind!=="great"&&kind!=="corner"){say("c1",pick(L.leading));updGauge();return}
  if(kind==="forced"){ say("forced",pick(L.forced)) }
  else if(kind==="even"){ if(cocky>=3&&Math.random()<.5)say("c1",pick(L.cockyOk)); else say("even",pick(board.filter(v=>v===0).length>=48?L.evenOpen:L.even)) }
  else if(kind==="ok"){ if(cocky>=3&&Math.random()<.6)say("c1",pick(L.cockyOk)); else say("ok") }
  else if(kind==="bad"||kind==="awful"||kind==="gift"){
    if(cocky>=6)say("c2",pick(L.cocky2));
    else if(cocky>=3)say("c1",pick(L.cocky1));
    else say(kind);
  }
  updGauge();
}
function aiTurn(){
  if(over)return;
  const ms=moves(board,W);
  if(!ms.length){
    if(!moves(board,B).length)return finish();
    say("aiPass");turn=B;busy=false;refreshHint();return;
  }
  const i=chooseAI(),f=flips(board,i,W).length;
  board=play(board,i,W);lastMove=i;turn=B;
  if(!moves(board,B).length){
    if(!moves(board,W).length)return(render(),finish());
    render();say("pass");busy=true;setTimeout(aiTurn,readWait());return;
  }
  render();
  if(CORNERS.includes(i))say("mineCorner");
  else if(cocky<3&&Math.random()<.6)say("mine");
  busy=false;refreshHint();
}

function getClears(){try{return JSON.parse(localStorage.getItem("mg_clears")||"{}")}catch(e){return{}}}
function saveClear(l){try{const c=getClears();c[l]=1;localStorage.setItem("mg_clears",JSON.stringify(c))}catch(e){}}
function showClears(){const c=getClears();$("clears").textContent="🏅 ノーヒント勝利："+[1,2,3].map(l=>LVN[l]+(c[l]?"✔":"－")).join("　")}
function finish(){
  over=true;busy=false;hints=[];clearTimeout(idleT);render();$("sensei").style.display="none";$("face").className="face";
  const[x,o]=count(board);
  const ob=$("ob"),ot=$("ot"),op=$("op");
  let k,txt,face;
  if(x>o){
    if(!hinted){
      saveClear(level);showClears();
      ob.textContent="😭";ot.textContent="ノーヒント勝利！（限定）";face="win";k="pure";
    }else{ob.textContent="😭";ot.textContent="わからされた…♡";face="win";k="win"}
  }else if(x<o){ob.textContent="👑";ot.textContent="わからせ完了♡";face="lose";k="lose"}
  else{ob.textContent="😤";ot.textContent="引き分け…";face="draw";k="draw"}
  txt=pick(END[k][level]);
  if((k==="win"||k==="pure")&&maxCocky>=3)txt=pick(L.humbled)+"\n"+txt;
  op.textContent=`【${LVN[level]}】 ${x} - ${o}\n`+txt;
  op.style.whiteSpace="pre-line";
  say(face,txt);
  if(k==="pure")setFace("cry");
  setTimeout(()=>{if(over)$("over").style.display="grid"},900);
}
